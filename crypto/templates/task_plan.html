<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务计划 · 长期主义 - MACD &amp; ADX Pro3</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/mdialog.js') }}"></script>
    <script src="{{ url_for('static', filename='js/echarts.min.js') }}"></script>
    <style>
        /* ============ 任务计划页面（长期主义版本 Longtermism v1.1） ============ */
        .plan-page { max-width: 1200px; margin: 30px auto; padding: 0 20px 40px; }
        .plan-page h1 { margin-bottom: 8px; }
        .plan-desc { color: var(--text-muted); margin-bottom: 24px; }

        /* 长期主义欢迎横幅 */
        .longterm-banner {
            background: linear-gradient(135deg, #e8f7ee, #f0f9ff);
            border: 1px solid #b8e6c9; border-radius: 12px;
            padding: 14px 20px; margin-bottom: 20px;
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(40,167,69,0.08);
        }
        .longterm-banner .lt-icon { font-size: 1.6rem; }
        .longterm-banner .lt-title { font-weight: 800; font-size: 1rem; color: #1a7f42; }
        .longterm-banner .lt-desc { font-size: 0.85rem; color: #2d6a4f; }
        .longterm-banner .lt-badge {
            margin-left: auto; background: #28a745; color: #fff;
            font-size: 0.72rem; font-weight: 700; padding: 3px 12px;
            border-radius: 12px; flex-shrink: 0;
        }

        /* 总览统计栏 */
        .plan-overview {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px; margin-bottom: 20px;
        }
        .overview-item {
            background: var(--card-bg); border-radius: 12px; padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center;
            border: 1px solid var(--border-color); transition: all .2s;
        }
        .overview-item:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
        .overview-item .ov-num {
            font-size: 1.6rem; font-weight: 800; color: var(--primary-color);
            background: linear-gradient(135deg, #0b5ed7, #00d2ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .overview-item .ov-label { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }

        /* 每日/累积打卡统计双曲线图面板 */
        .checkin-stats-panel {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 14px 20px; margin-bottom: 20px;
        }
        .checkin-stats-panel .cf-title {
            font-size: 0.92rem; font-weight: 700; margin-bottom: 10px;
            display: flex; align-items: center; gap: 8px;
        }

        /* 状态分组 */
        .status-group { margin-bottom: 28px; }
        .status-group-title {
            font-size: 1.02rem; font-weight: 700; margin-bottom: 12px;
            display: flex; align-items: center; gap: 8px;
            padding-left: 10px; border-left: 4px solid var(--primary-color);
        }
        .status-group-title.sg-in_progress { border-left-color: #0b5ed7; }
        .status-group-title.sg-pending { border-left-color: #ffc107; }
        .status-group-title.sg-completed { border-left-color: #28a745; }
        .status-group-title.sg-ended { border-left-color: #dc3545; }
        .status-group-title .sg-count {
            background: #f0f4ff; border-radius: 10px; padding: 1px 10px;
            font-size: 0.78rem; color: var(--text-muted); font-weight: 600;
        }
        #card-grid { display: block; }

        /* 今日在场面板（长期主义版：只报喜不施压） */
        .today-panel {
            background: linear-gradient(135deg, var(--card-bg), #f8fbff);
            border: 1px solid var(--border-color); border-radius: 12px; padding: 14px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px;
            display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
        }
        .today-item { display: flex; align-items: center; gap: 8px; font-size: 0.92rem; }
        .today-item .dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 4px rgba(0,0,0,0.2); }
        .dot-ok { background: #28a745; }
        .dot-warn { background: #ffc107; }
        .dot-danger { background: #dc3545; }
        .today-welcome {
            font-size: 1.02rem; font-weight: 800; padding: 6px 14px;
            border-radius: 10px; flex-shrink: 0;
        }
        .today-welcome.present-ok { background: #d4edda; color: #155724; }
        .today-welcome.present-idle { background: #fff3cd; color: #7a5b00; }
        .today-hint { color: var(--text-muted); font-size: 0.85rem; }
        .slot-encourage {
            margin-top: 10px; padding: 8px 12px; border-radius: 8px;
            background: #e8f7ee; border: 1px dashed #b8e6c9;
            font-size: 0.82rem; color: #1a7f42; text-align: center;
        }
        .task-card .tc-presence { color: #1a7f42; font-weight: 600; }

        /* 在场日历（v1.1：GitHub 贡献图风格，断档如实呈现） */
        .cal-wrap {
            margin-top: 14px; padding-top: 12px;
            border-top: 1px dashed var(--border-color); width: 100%;
        }
        .cal-title { font-size: 0.85rem; font-weight: 600; color: #1a7f42; margin-bottom: 10px; }
        .cal-grid { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 4px; }
        .cal-rows { display: flex; flex-direction: column; gap: 3px; margin-right: 2px; flex-shrink: 0; }
        .cal-row-label {
            width: 14px; height: 12px; font-size: 0.62rem; color: var(--text-muted);
            display: flex; align-items: center; justify-content: center;
        }
        .cal-col { display: flex; flex-direction: column; gap: 3px; }
        .cal-cell {
            width: 12px; height: 12px; border-radius: 3px; background: #ebedf0;
            transition: transform .1s;
        }
        .cal-cell:hover { transform: scale(1.35); }
        .cal-cell.lv1 { background: #c6e48b; }
        .cal-cell.lv2 { background: #7bc96f; }
        .cal-cell.lv3 { background: #239a3b; }
        .cal-cell.lv4 { background: #196127; }
        .cal-cell.future { opacity: 0.35; }
        .cal-cell.empty { background: transparent; }
        .cal-legend {
            display: flex; align-items: center; gap: 4px; margin-top: 8px;
            font-size: 0.72rem; color: var(--text-muted); justify-content: flex-end;
        }
        .cal-legend .cal-cell { width: 10px; height: 10px; display: inline-block; }

        /* 任务卡网格 */
        .card-section-title {
            font-size: 1.05rem; font-weight: 700; margin: 24px 0 12px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .card-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
        }
        .task-card {
            background: var(--card-bg); border-radius: 12px; padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer;
            border: 2px solid transparent; transition: all .2s; position: relative;
        }
        .task-card:hover { transform: translateY(-3px); box-shadow: 0 6px 18px rgba(0,0,0,0.12); }
        .task-card.locked { opacity: 0.6; cursor: not-allowed; }
        .task-card.st-in_progress { border-color: #0b5ed7; }
        .task-card.st-completed { border-color: #28a745; }
        .task-card.st-failed { border-color: #dc3545; }
        .task-card.st-abandoned { border-color: #aaa; opacity: 0.7; }
        .task-card .tc-type { font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; flex-shrink: 0; }
        .tc-type.learn { background: #e2f0ff; color: #0b5ed7; }
        .tc-type.trade { background: #fff3cd; color: #997404; }
        .task-card .tc-head { display: flex; align-items: center; gap: 8px; }
        .task-card .tc-title { font-size: 0.95rem; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .task-card .tc-round { font-size: 0.78rem; color: var(--text-muted); }
        .task-card .tc-body { margin-top: 8px; }
        .task-card .tc-progress { margin: 10px 0 6px; }
        .task-card .tc-bar {
            height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden;
        }
        .task-card .tc-bar-fill { height: 100%; background: linear-gradient(90deg, #0b5ed7, #00d2ff); border-radius: 4px; transition: width .3s; }
        .task-card .tc-meta { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted); }
        .task-card .tc-status {
            font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; flex-shrink: 0;
        }
        .st-pending .tc-status { background: #eee; color: #666; }
        .st-in_progress .tc-status { background: #d4edda; color: #155724; }
        .st-completed .tc-status { background: #28a745; color: #fff; }
        .st-failed .tc-status { background: #dc3545; color: #fff; }
        .st-abandoned .tc-status { background: #aaa; color: #fff; }
        .task-card .tc-reward { font-weight: 700; color: #e07b00; }
        .task-card .tc-penalty { color: #dc3545; font-weight: 600; }
        .task-card .tc-hit { color: var(--primary-color); font-weight: 600; }
        .task-card .tc-lock-icon { font-size: 1rem; flex-shrink: 0; }
        .task-card .tc-meta-2 { margin-top: 4px; }

        /* 卡片重置按钮 */
        .task-card .tc-reset-btn {
            border: none; background: #f0f0f0; border-radius: 6px;
            width: 24px; height: 24px; font-size: 0.8rem; cursor: pointer;
            flex-shrink: 0; line-height: 1; transition: all .15s;
        }
        .task-card .tc-reset-btn:hover { background: #fde8e8; transform: rotate(-20deg); }

        /* 待开始卡片：默认折叠，只显示标题行 */
        .task-card.collapsed { padding: 10px 16px; }
        .task-card.collapsed .tc-body { display: none; }
        .task-card .tc-collapse-btn {
            margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-color);
            font-size: 0.78rem; color: var(--text-muted); text-align: center; cursor: pointer;
        }
        .task-card .tc-collapse-btn:hover { color: var(--primary-color); }
        .task-card.collapsed .tc-collapse-open { display: inline; }
        .task-card:not(.collapsed) .tc-collapse-open { display: none; }
        .task-card.collapsed .tc-collapse-close { display: none; }
        .task-card:not(.collapsed) .tc-collapse-close { display: inline; }

        /* 卡片详情弹窗 */
        .card-modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .card-modal {
            background: #fff; border-radius: 14px; width: 780px; max-width: 95vw;
            max-height: 88vh; display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 12px 40px rgba(0,0,0,0.2);
        }
        .card-modal-head {
            padding: 16px 20px; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
        }
        .card-modal-head .cm-title { font-size: 1.05rem; font-weight: 700; }
        .card-modal-head .cm-close {
            border: none; background: #f0f0f0; border-radius: 6px; width: 30px; height: 30px;
            cursor: pointer; font-size: 1rem;
        }
        .card-modal-tabs { display: flex; gap: 4px; padding: 10px 20px 0; border-bottom: 1px solid var(--border-color); }
        .cm-tab {
            padding: 8px 16px; border: none; background: none; cursor: pointer;
            font-size: 0.9rem; color: var(--text-muted); border-bottom: 2px solid transparent;
        }
        .cm-tab.active { color: var(--primary-color); border-bottom-color: var(--primary-color); font-weight: 600; }
        .cm-tab { position: relative; }
        /* 提前通关引导横幅 */
        .ov-early-banner {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border: 1px solid #66bb6a; border-radius: 8px;
            padding: 12px 16px; margin-bottom: 16px;
            font-size: 0.9rem; color: #2e7d32;
            display: flex; align-items: center; gap: 8px;
        }
        /* 结算 Tab 徽章 */
        .cm-tab-badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 16px; height: 16px; margin-left: 4px;
            background: #ff5722; color: #fff; border-radius: 50%;
            font-size: 10px; font-weight: 700; line-height: 1;
            animation: badge-pulse 1.5s ease-in-out infinite;
        }
        .cm-tab-glow { animation: tab-glow 2s ease-in-out infinite; }
        @keyframes badge-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        @keyframes tab-glow {
            0%, 100% { color: var(--text-muted); }
            50% { color: #ff5722; }
        }
        .card-modal-body { padding: 20px; overflow-y: auto; flex: 1; }

        /* 概览 */
        .cm-overview .ov-row { display: flex; margin-bottom: 8px; font-size: 0.9rem; }
        .cm-overview .ov-row .label { width: 90px; color: var(--text-muted); flex-shrink: 0; }
        .cm-overview .ov-row input[type="text"], .cm-overview .ov-row input[type="datetime-local"], .cm-overview .ov-row textarea {
            flex: 1; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 6px;
            font-size: 0.9rem; font-family: inherit;
        }
        .cm-overview .ov-row textarea { min-height: 60px; resize: vertical; }
        .cm-big-progress { margin: 12px 0; }
        .cm-big-bar { height: 14px; background: #f0f0f0; border-radius: 7px; overflow: hidden; }
        .cm-big-fill { height: 100%; background: linear-gradient(90deg, #007bff, #00d2ff); border-radius: 7px; transition: width .3s; }

        /* 100 格打卡（紧凑布局） */
        .slot-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
        .slot-cell {
            aspect-ratio: 1; border: 1px solid var(--border-color); border-radius: 3px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.6rem; color: #bbb; cursor: pointer; background: #fafafa;
            transition: all .12s; position: relative;
        }
        .slot-cell:hover { border-color: var(--primary-color); transform: scale(1.08); }
        .slot-cell.filled { background: #d4edda; border-color: #28a745; color: #155724; font-weight: 600; }
        .slot-cell.locked { cursor: not-allowed; }
        .slot-cell.locked:hover { border-color: var(--border-color); transform: none; }
        .slot-cell .slot-title { position: absolute; top: 1px; left: 2px; font-size: 0.5rem; color: #999; line-height: 1; }
        .slot-grid-legend { display: flex; gap: 16px; margin-top: 10px; font-size: 0.78rem; color: var(--text-muted); flex-wrap: wrap; }

        /* 打卡记录列表（含时间与内容摘要） */
        .slot-record-list { margin-top: 14px; border-top: 1px dashed var(--border-color); padding-top: 10px; }
        .slot-record-list .srl-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 8px; }
        .slot-record-item {
            display: flex; align-items: center; gap: 10px; padding: 6px 10px;
            border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 6px;
            font-size: 0.85rem; background: #fafafa;
        }
        .slot-record-item .srl-index { flex-shrink: 0; color: var(--text-muted); width: 56px; }
        .slot-record-item .srl-content { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .slot-record-item .srl-time { flex-shrink: 0; color: var(--text-muted); font-size: 0.76rem; }
        .slot-record-item .srl-del {
            border: none; background: transparent; color: #dc3545; cursor: pointer;
            font-size: 0.8rem; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; transition: all .12s;
        }
        .slot-record-item .srl-del:hover { background: #fde8e8; }

        /* 目标拆解 */
        .milestone-item {
            display: flex; align-items: center; gap: 10px; padding: 8px 10px;
            border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 8px;
        }
        .milestone-item.done .ms-content { text-decoration: line-through; color: var(--text-muted); }
        .milestone-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }
        .milestone-item .ms-content { flex: 1; font-size: 0.9rem; min-width: 0; word-break: break-all; }
        .milestone-item .ms-edit-input {
            flex: 1; min-width: 0; padding: 4px 8px; font-size: 0.9rem;
            border: 1px solid var(--primary-color); border-radius: 6px; outline: none;
            box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.12);
        }
        .milestone-item .ms-action {
            cursor: pointer; border: none; background: none; font-size: 0.85rem;
            padding: 2px 5px; border-radius: 6px; flex-shrink: 0; transition: background .15s;
        }
        .milestone-item .ms-action:hover { background: #f0f4ff; }
        .milestone-item .ms-action.ms-del:hover { background: #fde8e8; }
        .milestone-add { display: flex; gap: 8px; margin-top: 10px; }
        .milestone-add input { flex: 1; padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 6px; }

        /* TodoList（任务目标子任务清单） */
        .todo-item {
            display: flex; align-items: center; gap: 8px; padding: 7px 10px;
            border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 6px;
            background: #fff; transition: all .15s;
        }
        .todo-item:hover { border-color: var(--primary-color); }
        .todo-item input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
        .todo-item .todo-content { flex: 1; font-size: 0.9rem; min-width: 0; word-break: break-all; }
        .todo-item.done .todo-content { text-decoration: line-through; color: var(--text-muted); }
        .todo-item .todo-edit-input {
            flex: 1; padding: 4px 8px; border: 1px solid var(--primary-color); border-radius: 6px;
            font-size: 0.9rem; font-family: inherit;
        }
        .todo-item .todo-action {
            border: none; background: transparent; cursor: pointer; font-size: 0.8rem;
            padding: 2px 5px; border-radius: 4px; flex-shrink: 0; transition: all .12s;
        }
        .todo-item .todo-action:hover { background: #f0f4ff; }
        .todo-item .todo-action.todo-del { color: #dc3545; }
        .todo-item .todo-action.todo-del:hover { background: #fde8e8; }

        /* 打卡详情 Tab */
        .checkin-summary {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px; margin-bottom: 14px;
        }
        .checkin-summary .cs-item {
            background: #f8fbff; border: 1px solid var(--border-color); border-radius: 10px;
            padding: 10px 12px; text-align: center;
        }
        .checkin-summary .cs-num { font-size: 1.2rem; font-weight: 800; color: var(--primary-color); }
        .checkin-summary .cs-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
        .checkin-chart-box {
            border: 1px solid var(--border-color); border-radius: 10px; padding: 10px;
            margin-bottom: 14px; background: #fff;
        }
        .checkin-chart-box .ccb-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #41617f; }

        /* 小记：输入框固定在顶部（sticky），避免被记录列表挤到底部 */
        .note-input-wrap {
            position: sticky; top: -20px; z-index: 5;
            background: #fff; padding: 10px 0 12px; margin: -20px 0 14px;
            border-bottom: 1px dashed var(--border-color);
        }
        .note-item {
            border-left: 3px solid var(--primary-color); padding: 6px 12px;
            margin-bottom: 10px; background: #f8f9fa; border-radius: 0 8px 8px 0;
        }
        .note-item .note-time { font-size: 0.75rem; color: var(--text-muted); }
        .note-item .note-content { font-size: 0.9rem; margin-top: 2px; }

        /* 结算 */
        .settle-info { background: #f8f9fa; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
        .settle-info .si-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 0.9rem; }
        .settle-info .si-row.total { font-weight: 700; border-top: 1px dashed var(--border-color); margin-top: 6px; padding-top: 8px; font-size: 1rem; }

        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    {% include 'nav.html' %}
    <div class="plan-page">
        <header>
            <h1>📋 任务计划</h1>
            <p class="plan-desc">长期主义自我激励系统 | 学习 1000 小时做出稳定量化系统 · 交易 1000 小时翻 10 番到 10 万 U</p>
        </header>

        <!-- 长期主义欢迎横幅 -->
        <div class="longterm-banner">
            <span class="lt-icon">🌱</span>
            <span class="lt-title">长期主义</span>
            <span class="lt-desc">今天在场，比今天做多少更重要 · 想开始就开始，几分钟也算在场 · 中断了也没关系，随时欢迎回来</span>
            <span class="lt-badge">Longtermism v1.1</span>
        </div>

        <!-- 总览统计栏 -->
        <div id="plan-overview" class="plan-overview"></div>

        <!-- 每日/累积打卡统计表（严格区分学习与交易） -->
        <div id="checkin-stats-panel" class="checkin-stats-panel" style="display:none;"></div>

        <!-- 今日在场面板（长期主义版：只报喜不施压，含在场日历） -->
        <div id="today-panel" class="today-panel"></div>

        <!-- 分析纪律看板（批次11）：合规率 / 断档热力 / 补记率 / 归因对比 / 规则配置。
             放在打卡面板与任务卡之间——闸门拦住人的地方，就是该看到证据的地方。
             样式与渲染全在 discipline_board.js 内，这里只给挂载点 -->
        <div id="discipline-panel" style="display:none;"></div>

        <!-- 计划详情（任务卡列表 - 统一网格） -->
        <div id="plan-detail">
            <div class="card-section-title">
                <span id="section-title">📋 任务卡</span>
                <span style="display:flex;gap:8px;">
                    <button class="m-btn m-btn-primary m-btn-sm btn-add-card" data-type="learn">＋ 新学习任务</button>
                    <button class="m-btn m-btn-primary m-btn-sm btn-add-card" data-type="trade">＋ 新交易任务</button>
                </span>
            </div>
            <div id="card-grid" class="card-grid"></div>
        </div>
    </div>

    <!-- 卡片详情弹窗 -->
    <div class="card-modal-overlay" id="card-modal" style="display:none;">
        <div class="card-modal">
            <div class="card-modal-head">
                <span class="cm-title" id="cm-title"></span>
                <button class="cm-close" onclick="TaskPlan.closeCardModal()">✕</button>
            </div>
            <div class="card-modal-tabs" id="cm-tabs"></div>
            <div class="card-modal-body" id="cm-body"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/task_plan.js') }}"></script>
    <script src="{{ url_for('static', filename='js/discipline_board.js') }}"></script>
</body>
</html>
