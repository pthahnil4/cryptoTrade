<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ symbol }} 详情 - 策略回测分析</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/echarts.min.js') }}"></script>
</head>
<body>
    {% include 'nav.html' %}

    <div class="page-wrapper">
        <div class="detail-page">
            <!-- 返回与标题 -->
            <div class="detail-topbar">
                <a href="/" class="back-link">← 返回监控台</a>
                <h1 class="detail-title"><span id="detail-symbol-name">{{ symbol }}</span> <span class="detail-subtitle" id="detail-subtitle">策略详情 &amp; 回测分析</span></h1>
                <a href="/multi-period/{{ symbol }}" id="multi-period-link" class="back-link multi-link">🔍 多周期总览 →</a>
            </div>

            <!-- 币种选择器 -->
            <div id="detail-symbol-selector" class="bar-selector">
                <span class="bar-label">💰 币种:</span>
                <select id="detail-symbol-select" class="dual-period-select"></select>
            </div>

            <!-- 策略选择器 -->
            <div id="detail-strategy-selector" class="bar-selector strategy-selector">
                <span class="bar-label">📋 策略:</span>
                <button class="m-btn m-btn-primary m-btn-xs m-btn-outline m-btn-pill" data-strategy="single">单周期Pro3</button>
                <button class="m-btn m-btn-primary m-btn-xs m-btn-outline m-btn-pill active" data-strategy="dual">双周期Pro3</button>
                <button class="m-btn m-btn-primary m-btn-xs m-btn-outline m-btn-pill" data-strategy="boll">BOLL限价</button>
            </div>

            <!-- 单周期 / BOLL 周期选择器 -->
            <div id="detail-bar-selector" class="bar-selector">
                <span class="bar-label">📊 周期:</span>
                <button class="m-btn m-btn-primary m-btn-xs m-btn-outline m-btn-pill" data-bar="3m">3m</button>
                <button class="m-btn m-btn-primary m-btn-xs m-btn-outline m-btn-pill" data-bar="5m">5m</button>
                <button class="m-btn m-btn-primary m-btn-xs m-btn-outline m-btn-pill" data-bar="15m">15m</button>
                <button class="m-btn m-btn-primary m-btn-xs m-btn-outline m-btn-pill" data-bar="30m">30m</button>
                <button class="m-btn m-btn-primary m-btn-xs m-btn-outline m-btn-pill active" data-bar="1H">1H</button>
                <button class="m-btn m-btn-primary m-btn-xs m-btn-outline m-btn-pill" data-bar="2H">2H</button>
                <button class="m-btn m-btn-primary m-btn-xs m-btn-outline m-btn-pill" data-bar="4H">4H</button>
                <button class="m-btn m-btn-primary m-btn-xs m-btn-outline m-btn-pill" data-bar="6H">6H</button>
                <button class="m-btn m-btn-primary m-btn-xs m-btn-outline m-btn-pill" data-bar="12H">12H</button>
                <button class="m-btn m-btn-primary m-btn-xs m-btn-outline m-btn-pill" data-bar="1D">1D</button>
                <button class="m-btn m-btn-primary m-btn-xs m-btn-outline m-btn-pill" data-bar="1W">1W</button>
            </div>

            <!-- 双周期策略：短周期 + 长周期选择器 -->
            <div id="detail-dual-selector" class="bar-selector dual-period-selector" style="display:none;">
                <span class="bar-label">📊 短周期:</span>
                <select id="dual-short-bar" class="dual-period-select">
                    <option value="5m">5m</option>
                    <option value="15m" selected>15m</option>
                    <option value="1H">1H</option>
                </select>
                <span class="bar-label" style="margin-left:12px;">📊 长周期:</span>
                <select id="dual-long-bar" class="dual-period-select">
                    <option value="1H">1H</option>
                    <option value="4H" selected>4H</option>
                    <option value="1D">1D</option>
                    <option value="1W">1W</option>
                </select>
            </div>

            <!-- BOLL策略：短周期 + 长周期选择器 -->
            <div id="detail-boll-selector" class="bar-selector dual-period-selector" style="display:none;">
                <span class="bar-label">📊 短周期:</span>
                <select id="boll-short-bar" class="dual-period-select">
                    <option value="5m">5m</option>
                    <option value="15m" selected>15m</option>
                    <option value="1H">1H</option>
                </select>
                <span class="bar-label" style="margin-left:12px;">📊 长周期:</span>
                <select id="boll-long-bar" class="dual-period-select">
                    <option value="1H">1H</option>
                    <option value="4H" selected>4H</option>
                    <option value="1D">1D</option>
                </select>
            </div>

            <!-- 趋势策略：短周期信号算法 + 开仓 / 平仓价格取值选择器（single/dual 可见，boll 隐藏） -->
            <div id="detail-price-selector" class="bar-selector dual-period-selector">
                <span class="bar-label">⚙️ 信号算法:</span>
                <select id="signal-algo" class="dual-period-select">
                    <option value="diff" selected>灵敏模式 (平滑差)</option>
                    <option value="hybrid">稳定模式 (状态机)</option>
                </select>
                <span class="bar-label" style="margin-left:12px;">💵 开仓价格:</span>
                <select id="entry-price-type" class="dual-period-select">
                    <option value="open">开盘价 (open)</option>
                    <option value="close" selected>收盘价 (close)</option>
                </select>
                <span class="bar-label" style="margin-left:12px;">💵 平仓价格:</span>
                <select id="exit-price-type" class="dual-period-select">
                    <option value="close">收盘价 (close)</option>
                    <option value="open" selected>开盘价 (open)</option>
                </select>
            </div>

            <!-- 收益曲线图（ECharts，支持悬停与缩放） -->
            <section class="detail-section" id="profit-chart-section" style="display:none;">
                <h2 class="section-title">📉 收益曲线 <span id="profit-chart-hint" style="font-size:0.8rem;color:#999;font-weight:normal;">（剔除交易不计入 · 滚轮/拖动缩放查看不同时间段）</span></h2>
                <div id="profit-chart" style="width:100%;height:400px;"></div>
            </section>

            <!-- 加载中 -->
            <div id="detail-loading" class="loading">⏳ 正在加载策略数据...</div>

            <!-- 错误提示 -->
            <div id="detail-error" class="card-error" style="display:none; padding:20px;"></div>

            <!-- ============ 主内容区（初始隐藏） ============ -->
            <div id="detail-content" style="display:none;">

                <!-- 当前行情概览 -->
                <div class="detail-summary" id="market-summary">
                </div>

                <!-- 历史交易记录 -->
                <section class="detail-section">
                    <h2 class="section-title">📜 历史交易记录 <span id="trade-count" style="font-size:0.8rem;color:#999;"></span></h2>
                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>方向</th>
                                    <th>开仓时间</th>
                                    <th>开仓价</th>
                                    <th>平仓时间</th>
                                    <th>平仓价</th>
                                    <th>盈亏</th>
                                    <th>最大盈利</th>
                                    <th>最大亏损</th>
                                    <th>入场ADX</th>
                                    <th>持仓时长</th>
                                    <th>状态</th>
                                </tr>
                            </thead>
                            <tbody id="trade-tbody">
                            </tbody>
                        </table>
                    </div>
                </section>

                <!-- 策略回测结果 -->
                <section class="detail-section">
                    <h2 class="section-title">📈 策略回测结果</h2>
                    <div class="backtest-grid" id="stats-grid">
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script>
    (function() {
        let SYMBOL = "{{ symbol }}";
        const loadingEl = document.getElementById('detail-loading');
        const errorEl = document.getElementById('detail-error');
        const contentEl = document.getElementById('detail-content');

        // ================================================================
        // 状态变量
        // ================================================================
        let CURRENT_BAR = '1H';
        let CURRENT_STRATEGY = 'dual';   // 默认双周期组合
        let DUAL_SHORT_BAR = '15m';      // 默认双周期组合：15m-4H
        let DUAL_LONG_BAR = '4H';
        let BOLL_SHORT_BAR = '15m';
        let BOLL_LONG_BAR = '4H';
        let ENTRY_PRICE_TYPE = 'close';  // 开仓价格取值（默认收盘价）
        let EXIT_PRICE_TYPE = 'open';    // 平仓价格取值（默认开盘价）
        let SIGNAL_ALGO = 'diff';        // 短周期信号算法（默认平滑差灵敏模式）

        // 双周期默认组合映射
        const DUAL_DEFAULT_MAP = { '5m': '1H', '15m': '4H', '1H': '1D' };
        const BOLL_DEFAULT_MAP = { '5m': '1H', '15m': '4H', '1H': '1D' };

        // ================================================================
        // 币种选择器
        // ================================================================
        function symbolLabel(instId) {
            // BTC-USDT-SWAP -> BTC；非标准格式则原样展示
            return String(instId || '').replace(/-USDT-SWAP$/, '');
        }

        function setupSymbolSelector() {
            var sel = document.getElementById('detail-symbol-select');
            if (!sel) return;
            fetch('/api/strategy/config')
                .then(function(r) { return r.json(); })
                .then(function(res) {
                    var data = (res.code === 200 && res.data) ? res.data : {};
                    var fixed = data.fixed_coins || [];
                    var floating = data.floating_coins || [];
                    // 兼容旧接口：无分组字段时退化为单一 all_coins 列表
                    if (!fixed.length && !floating.length) {
                        fixed = data.all_coins || [];
                    }
                    // 确保当前币种一定在列表中（即使不在配置里），归入固定组
                    if (SYMBOL && fixed.indexOf(SYMBOL) < 0 && floating.indexOf(SYMBOL) < 0) {
                        fixed = [SYMBOL].concat(fixed);
                    }

                    function buildOptions(list) {
                        return list.map(function(c) {
                            var selected = (c === SYMBOL) ? ' selected' : '';
                            return '<option value="' + c + '"' + selected + '>' + symbolLabel(c) + '</option>';
                        }).join('');
                    }

                    var html = '';
                    if (fixed.length) {
                        html += '<optgroup label="固定币种（' + fixed.length + '）">' + buildOptions(fixed) + '</optgroup>';
                    }
                    if (floating.length) {
                        html += '<optgroup label="浮动币种（' + floating.length + '）">' + buildOptions(floating) + '</optgroup>';
                    }
                    sel.innerHTML = html || buildOptions([SYMBOL]);
                })
                .catch(function() {
                    // 拉取失败时至少保留当前币种
                    sel.innerHTML = '<option value="' + SYMBOL + '" selected>' + symbolLabel(SYMBOL) + '</option>';
                });

            sel.addEventListener('change', function() {
                var newSymbol = sel.value;
                if (!newSymbol || newSymbol === SYMBOL) return;
                SYMBOL = newSymbol;
                // 同步更新页面标题、标签页标题、多周期链接与 URL
                var nameEl = document.getElementById('detail-symbol-name');
                if (nameEl) nameEl.textContent = SYMBOL;
                document.title = SYMBOL + ' 详情 - 策略回测分析';
                var mpLink = document.getElementById('multi-period-link');
                if (mpLink) mpLink.setAttribute('href', '/multi-period/' + encodeURIComponent(SYMBOL));
                try {
                    window.history.replaceState(null, '', '/detail/' + encodeURIComponent(SYMBOL));
                } catch (e) { /* 忽略不支持 history 的环境 */ }
                loadDetail();
            });
        }

        // ================================================================
        // 策略选择器
        // ================================================================
        function setupStrategySelector() {
            var container = document.getElementById('detail-strategy-selector');
            if (!container) return;
            container.querySelectorAll('button[data-strategy]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var s = btn.dataset.strategy;
                    if (s === CURRENT_STRATEGY) return;
                    CURRENT_STRATEGY = s;
                    container.querySelectorAll('button[data-strategy]').forEach(function(b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    togglePeriodSelectors();
                    loadDetail();
                });
            });
        }

        // 根据当前策略切换周期选择器的显示/隐藏
        function togglePeriodSelectors() {
            var singleBar = document.getElementById('detail-bar-selector');
            var dualSel = document.getElementById('detail-dual-selector');
            var bollSel = document.getElementById('detail-boll-selector');
            var priceSel = document.getElementById('detail-price-selector');
            singleBar.style.display = (CURRENT_STRATEGY === 'single') ? '' : 'none';
            dualSel.style.display = (CURRENT_STRATEGY === 'dual') ? '' : 'none';
            bollSel.style.display = (CURRENT_STRATEGY === 'boll') ? '' : 'none';
            // 价格取值选择器仅趋势策略（single/dual）可见
            priceSel.style.display = (CURRENT_STRATEGY === 'boll') ? 'none' : '';
        }

        // ================================================================
        // 信号算法 + 开/平仓价格取值选择器
        // ================================================================
        function setupPriceSelectors() {
            var algoSel = document.getElementById('signal-algo');
            var entrySel = document.getElementById('entry-price-type');
            var exitSel = document.getElementById('exit-price-type');
            if (algoSel) {
                algoSel.addEventListener('change', function() {
                    SIGNAL_ALGO = algoSel.value;
                    loadDetail();
                });
            }
            if (entrySel) {
                entrySel.addEventListener('change', function() {
                    ENTRY_PRICE_TYPE = entrySel.value;
                    loadDetail();
                });
            }
            if (exitSel) {
                exitSel.addEventListener('change', function() {
                    EXIT_PRICE_TYPE = exitSel.value;
                    loadDetail();
                });
            }
        }

        // ================================================================
        // 单周期选择器
        // ================================================================
        function setupBarSelector() {
            var container = document.getElementById('detail-bar-selector');
            if (!container) return;
            container.querySelectorAll('button[data-bar]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var bar = btn.dataset.bar;
                    if (bar === CURRENT_BAR) return;
                    CURRENT_BAR = bar;
                    container.querySelectorAll('button[data-bar]').forEach(function(b) { b.classList.remove('active'); });
                    btn.classList.add('active');
                    loadDetail();
                });
            });
        }

        // ================================================================
        // 双周期选择器（短周期 + 长周期下拉）
        // ================================================================
        function setupDualSelectors() {
            // 双周期
            var shortSel = document.getElementById('dual-short-bar');
            var longSel = document.getElementById('dual-long-bar');
            if (shortSel) {
                shortSel.addEventListener('change', function() {
                    DUAL_SHORT_BAR = shortSel.value;
                    // 自动联动长周期默认值
                    if (DUAL_DEFAULT_MAP[DUAL_SHORT_BAR]) {
                        DUAL_LONG_BAR = DUAL_DEFAULT_MAP[DUAL_SHORT_BAR];
                        longSel.value = DUAL_LONG_BAR;
                    }
                    loadDetail();
                });
            }
            if (longSel) {
                longSel.addEventListener('change', function() {
                    DUAL_LONG_BAR = longSel.value;
                    loadDetail();
                });
            }
            // BOLL
            var bollShortSel = document.getElementById('boll-short-bar');
            var bollLongSel = document.getElementById('boll-long-bar');
            if (bollShortSel) {
                bollShortSel.addEventListener('change', function() {
                    BOLL_SHORT_BAR = bollShortSel.value;
                    if (BOLL_DEFAULT_MAP[BOLL_SHORT_BAR]) {
                        BOLL_LONG_BAR = BOLL_DEFAULT_MAP[BOLL_SHORT_BAR];
                        bollLongSel.value = BOLL_LONG_BAR;
                    }
                    loadDetail();
                });
            }
            if (bollLongSel) {
                bollLongSel.addEventListener('change', function() {
                    BOLL_LONG_BAR = bollLongSel.value;
                    loadDetail();
                });
            }
        }

        // ================================================================
        // 工具函数 —— 含价格精度规则
        // ================================================================
        function fmtPrice(v) {
            var n = parseFloat(v);
            if (isNaN(n)) return v;
            var abs = Math.abs(n);
            if (abs < 10) return n.toFixed(3);
            if (abs < 100) return n.toFixed(2);
            if (abs < 1000) return n.toFixed(1);
            return Math.round(n).toString();
        }

        function fmtMoney(v) {
            var n = parseFloat(v);
            if (isNaN(n)) return v;
            return n.toFixed(2);
        }

        function fmtPct(v, forceSign) {
            var n = parseFloat(v);
            if (isNaN(n)) return v;
            var s = n.toFixed(2) + '%';
            return forceSign && n > 0 ? '+' + s : s;
        }

        function fmtRatio(v) {
            var n = parseFloat(v);
            if (isNaN(n)) return v;
            if (n === Infinity) return '∞';
            return n.toFixed(2);
        }

        function colorClass(val, threshold) {
            threshold = threshold || 0;
            if (val > threshold) return 'val-green';
            if (val < threshold) return 'val-red';
            return '';
        }

        function pctClass(val) {
            return colorClass(parseFloat(val));
        }

        // ================================================================
        // 渲染行情概览
        // ================================================================
        function renderMarketSummary(data) {
            var m = data.market;
            var cp = data.current_position;
            var isBoll = !!m.is_boll;
            var posClass = cp.status.indexOf('多') >= 0 ? 'val-green' : (cp.status === '无持仓' ? '' : 'val-red');

            var items = [];
            items.push({ label: '最新价格', value: '$' + fmtPrice(m.price), cls: 'val-blue' });

            if (isBoll) {
                items.push({ label: '长周期方向', value: m.long_direction || m.action_signal, cls: m.action_signal === '上涨' ? 'val-green' : m.action_signal === '下跌' ? 'val-red' : 'val-yellow' });
                items.push({ label: 'ADX', value: fmtMoney(m.adx), cls: m.adx > 25 ? 'val-green' : 'val-yellow' });
                items.push({ label: 'ATR', value: fmtMoney(m.atr), cls: '' });
            } else {
                items.push({ label: '趋势方向', value: m.action_signal, cls: m.action_signal === '上涨' ? 'val-green' : m.action_signal === '下跌' ? 'val-red' : 'val-yellow' });
                items.push({ label: 'MACD柱', value: fmtMoney(m.macd_histogram), cls: pctClass(m.macd_histogram) });
                items.push({ label: 'DIF', value: fmtMoney(m.macd_dif), cls: pctClass(m.macd_dif) });
                items.push({ label: 'ADX', value: fmtMoney(m.adx), cls: m.adx > 25 ? 'val-green' : 'val-yellow' });
                items.push({ label: '+DI / -DI', value: fmtMoney(m.plus_di) + ' / ' + fmtMoney(m.minus_di), cls: '' });
                items.push({ label: '平滑MACD', value: fmtMoney(m.smoothed_macd), cls: pctClass(m.smoothed_macd) });
                items.push({ label: '当前权重', value: fmtMoney(m.hist_weight), cls: '' });
                items.push({ label: 'ATR', value: fmtMoney(m.atr), cls: '' });
            }

            items.push({ label: '当前持仓', value: cp.status, cls: posClass });
            items.push({ label: '持仓盈亏', value: (cp.profit_pct >= 0 ? '+' : '') + fmtMoney(cp.profit_pct) + '%', cls: pctClass(cp.profit_pct) });
            items.push({ label: '入场价', value: '$' + fmtPrice(cp.entry_price), cls: 'val-blue' });

            document.getElementById('market-summary').innerHTML = items.map(function(item) {
                return '<div class="summary-item">' +
                    '<span class="summary-label">' + item.label + '</span>' +
                    '<span class="summary-value ' + item.cls + '">' + item.value + '</span>' +
                    '</div>';
            }).join('');
        }

        // ================================================================
        // 渲染交易记录表
        // ================================================================
        function renderTradeRecords(trades) {
            document.getElementById('trade-count').textContent = '(共 ' + trades.length + ' 笔)';
            var tbody = document.getElementById('trade-tbody');
            if (trades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" style="text-align:center;color:#bbb;padding:30px;">暂无交易记录</td></tr>';
                return;
            }
            tbody.innerHTML = trades.map(function(t) {
                var dirTag = t.direction === '多头' ? 'tag tag-long' : 'tag tag-short';
                var excludedStyle = t.excluded ? ' style="opacity:0.45;background:rgba(255,193,7,0.08);"' : '';
                var statusHtml = t.excluded ? '<span style="color:#f0ad4e;font-weight:600;font-size:0.85em;">⚠ 剔除</span>' : '';
                return '<tr' + excludedStyle + '>' +
                    '<td>' + t.index + '</td>' +
                    '<td><span class="' + dirTag + '">' + t.direction + '</span></td>' +
                    '<td>' + t.open_time + '</td>' +
                    '<td>$' + fmtPrice(t.open_price) + '</td>' +
                    '<td>' + t.close_time + '</td>' +
                    '<td>$' + fmtPrice(t.close_price) + '</td>' +
                    '<td class="' + pctClass(t.profit) + '">' + (t.profit >= 0 ? '+' : '') + fmtMoney(t.profit) + '%</td>' +
                    '<td class="val-green">+' + fmtMoney(t.max_win) + '%</td>' +
                    '<td class="val-red">' + fmtMoney(t.max_loss) + '%</td>' +
                    '<td>' + fmtMoney(t.entry_adx) + '</td>' +
                    '<td>' + t.duration + '</td>' +
                    '<td>' + statusHtml + '</td>' +
                    '</tr>';
            }).join('');
        }

        // ================================================================
        // 渲染策略统计
        // ================================================================
        function renderStats(data) {
            var s = data.stats;
            var isBoll = CURRENT_STRATEGY === 'boll';
            var grid = document.getElementById('stats-grid');

            var cards = [
                {
                    title: '收益概况',
                    items: [
                        { label: '测试周期', value: data.start_time + ' ~ ' + data.end_time },
                        { label: '总天数', value: data.total_days + ' 天' },
                        { label: '定投总收益', value: fmtPct(s.total_return_pct, true), cls: pctClass(s.total_return_pct) },
                        { label: '复投总收益', value: fmtPct(s.contract_return_pct, true), cls: pctClass(s.contract_return_pct) },
                        { label: '每日盈利', value: fmtPct(data.daily_profit, true), cls: pctClass(data.daily_profit) },
                        { label: '每周盈利', value: fmtPct(data.weekly_profit, true), cls: pctClass(data.weekly_profit) }
                    ]
                },
                {
                    title: '交易统计',
                    items: [
                        { label: '总交易次数', value: s.total_trades },
                        { label: '胜率', value: (s.win_rate * 100).toFixed(1) + '%', cls: s.win_rate >= 0.5 ? 'val-green' : 'val-red' },
                        { label: '盈利交易', value: s.winning_trades + ' 次', cls: 'val-green' },
                        { label: '亏损交易', value: s.losing_trades + ' 次', cls: 'val-red' },
                        { label: '平均每笔盈利', value: fmtPct(s.avg_profit_pct, true), cls: 'val-green' },
                        { label: '平均每笔亏损', value: fmtPct(s.avg_loss_pct, true), cls: 'val-red' }
                    ]
                },
                {
                    title: '风险指标',
                    items: [
                        { label: '最大回撤', value: fmtPct(s.max_drawdown_pct), cls: 'val-red' },
                        { label: '卡玛比率', value: fmtRatio(s.calmar_ratio), cls: s.calmar_ratio >= 1 ? 'val-green' : 'val-yellow' },
                        { label: '盈利因子', value: fmtRatio(s.profit_factor), cls: s.profit_factor >= 1.5 ? 'val-green' : 'val-yellow' },
                        { label: '盈亏比', value: fmtRatio(s.profit_loss_ratio), cls: s.profit_loss_ratio >= 1.5 ? 'val-green' : 'val-yellow' },
                        { label: '最大单笔盈利', value: fmtPct(s.max_single_profit_pct, true), cls: 'val-green' },
                        { label: '最大单笔亏损', value: fmtPct(s.max_single_loss_pct, true), cls: 'val-red' }
                    ]
                },
                {
                    title: '持仓与ADX',
                    items: [
                        { label: '平均持仓时长', value: s.avg_total_dur_h.toFixed(1) + ' 小时' },
                        { label: '盈利单平均时长', value: s.avg_win_dur_h.toFixed(1) + ' 小时', cls: 'val-green' },
                        { label: '亏损单平均时长', value: s.avg_loss_dur_h.toFixed(1) + ' 小时', cls: 'val-red' },
                        { label: '平均利润回撤', value: fmtPct(s.avg_retracement_pct, true), cls: 'val-yellow' },
                        { label: '入场ADX均值', value: fmtMoney(s.adx_mean) },
                        { label: '胜单ADX均值', value: fmtMoney(s.adx_win_mean), cls: 'val-green' }
                    ]
                }
            ];

            // ADX分析卡片 —— BOLL策略不显示权重
            if (!isBoll) {
                cards.push({
                    title: 'ADX分析',
                    items: [
                        { label: '亏单ADX均值', value: fmtMoney(s.adx_loss_mean), cls: 'val-red' },
                        { label: 'ADX-盈亏相关性', value: fmtMoney(s.adx_corr) },
                        { label: '高ADX(≥25)胜率', value: (s.high_adx_win_rate * 100).toFixed(1) + '%', cls: s.high_adx_win_rate >= 0.5 ? 'val-green' : 'val-red' },
                        { label: '低ADX(<25)胜率', value: (s.low_adx_win_rate * 100).toFixed(1) + '%', cls: s.low_adx_win_rate >= 0.5 ? 'val-green' : 'val-red' },
                        { label: '平均历史权重', value: fmtMoney(s.avg_hist_weight) },
                        { label: '平均当前权重', value: fmtMoney(s.avg_curr_weight) }
                    ]
                });
            }

            // 资金明细
            var fundItems = [
                { label: '初始资金', value: '$100.00' },
                { label: '定投最终资金', value: '$' + fmtMoney(s.fix_money), cls: pctClass(s.fix_money - 100) },
                { label: '复投最终资金', value: '$' + fmtMoney(s.contract_money), cls: pctClass(s.contract_money - 100) },
                { label: '混合最终资金', value: '$' + fmtMoney(s.mix_money), cls: pctClass(s.mix_money - 100) },
                { label: '盈利总和', value: fmtPct(s.total_profit_pct, true), cls: 'val-green' },
                { label: '亏损总和', value: fmtPct(s.total_loss_pct, true), cls: 'val-red' }
            ];
            if (isBoll && s.excluded_trades > 0) {
                fundItems.push({ label: '剔除交易数', value: s.excluded_trades + ' 笔', cls: 'val-yellow' });
            }
            cards.push({ title: '资金明细', items: fundItems });

            grid.innerHTML = cards.map(function(card) {
                var itemsHtml = card.items.map(function(item) {
                    return '<div class="bt-metric">' +
                        '<span class="bt-label">' + item.label + '</span>' +
                        '<span class="bt-value' + (item.cls ? ' ' + item.cls : '') + '">' + item.value + '</span>' +
                        '</div>';
                }).join('');
                return '<div class="backtest-card">' + itemsHtml + '</div>';
            }).join('');
        }

        // ================================================================
        // 渲染收益曲线图（ECharts：悬停显示数值 + 滚轮/滑块缩放）
        // ================================================================
        let profitChart = null;

        function renderProfitChart(data) {
            var section = document.getElementById('profit-chart-section');
            var el = document.getElementById('profit-chart');
            var trades = (data.trade_records || []).filter(function(t) { return !t.excluded; });
            if (!trades.length) {
                section.style.display = 'none';
                return;
            }
            section.style.display = '';

            // 逐笔累计：定投式累计收益% 与 复投式资金曲线（初始 $100）
            var closeTimes = [], cumSeries = [], moneySeries = [];
            var cum = 0, money = 100;
            trades.forEach(function(t) {
                var p = parseFloat(t.profit) || 0;
                cum += p;
                money *= (1 + p / 100);
                closeTimes.push(t.close_time);
                cumSeries.push(+cum.toFixed(2));
                moneySeries.push(+money.toFixed(2));
            });

            if (!profitChart) {
                profitChart = echarts.init(el);
                window.addEventListener('resize', function() { profitChart && profitChart.resize(); });
            }
            profitChart.setOption({
                backgroundColor: 'transparent',
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross', label: { backgroundColor: '#41617f' } },
                    formatter: function(params) {
                        var html = '<div style="font-weight:600;margin-bottom:4px;">第 ' + (params[0].dataIndex + 1) + ' 笔平仓 · ' + params[0].axisValue + '</div>';
                        params.forEach(function(p) {
                            var val = p.seriesName === '复投资金' ? '$' + p.value.toFixed(2) : (p.value >= 0 ? '+' : '') + p.value.toFixed(2) + '%';
                            html += p.marker + ' ' + p.seriesName + '：<b>' + val + '</b><br>';
                        });
                        return html;
                    }
                },
                legend: { data: ['累计收益%', '复投资金'], top: 4, icon: 'roundRect' },
                grid: { left: 56, right: 62, top: 36, bottom: 58 },
                xAxis: {
                    type: 'category', data: closeTimes, boundaryGap: false,
                    axisLabel: { fontSize: 10, color: '#8aa3ba', formatter: function(v) { return v.slice(5, 16); } },
                    axisLine: { lineStyle: { color: '#dfe9f3' } }
                },
                yAxis: [
                    {
                        type: 'value', name: '收益%', position: 'left',
                        axisLabel: { formatter: '{value}%', fontSize: 10, color: '#8aa3ba' },
                        splitLine: { lineStyle: { type: 'dashed', color: '#eef2f7' } }
                    },
                    {
                        type: 'value', name: '资金$', position: 'right',
                        axisLabel: { formatter: '${value}', fontSize: 10, color: '#8aa3ba' },
                        splitLine: { show: false }
                    }
                ],
                dataZoom: [
                    { type: 'inside', xAxisIndex: 0 },
                    { type: 'slider', xAxisIndex: 0, height: 18, bottom: 8, borderColor: '#dfe9f3', fillerColor: 'rgba(11,95,168,0.12)' }
                ],
                series: [
                    {
                        name: '累计收益%', type: 'line', data: cumSeries, smooth: true, symbol: 'circle', symbolSize: 5,
                        showSymbol: false, lineStyle: { width: 2.2, color: '#2f80ed' }, itemStyle: { color: '#2f80ed' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(47,128,237,0.28)' },
                                { offset: 1, color: 'rgba(47,128,237,0.02)' }
                            ])
                        },
                        markLine: {
                            silent: true, symbol: 'none',
                            lineStyle: { color: '#b8c4d0', type: 'dashed' },
                            label: { show: false },
                            data: [{ yAxis: 0 }]
                        }
                    },
                    {
                        name: '复投资金', type: 'line', yAxisIndex: 1, data: moneySeries, smooth: true,
                        showSymbol: false, lineStyle: { width: 1.8, color: '#27ae60', type: 'solid' }, itemStyle: { color: '#27ae60' },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(39,174,96,0.16)' },
                                { offset: 1, color: 'rgba(39,174,96,0.01)' }
                            ])
                        }
                    }
                ]
            }, true);
            profitChart.resize();
        }

        // ================================================================
        // 加载数据
        // ================================================================
        async function loadDetail() {
            loadingEl.style.display = 'block';
            contentEl.style.display = 'none';
            errorEl.style.display = 'none';
            document.getElementById('profit-chart-section').style.display = 'none';
            document.getElementById('detail-subtitle').textContent = '策略详情 &amp; 回测分析';
            try {
                var barParam = CURRENT_BAR;
                var longBarParam = '';
                var priceParam = '';
                if (CURRENT_STRATEGY === 'dual') {
                    barParam = DUAL_SHORT_BAR;
                    longBarParam = '&long_bar=' + DUAL_LONG_BAR;
                } else if (CURRENT_STRATEGY === 'boll') {
                    barParam = BOLL_SHORT_BAR;
                    longBarParam = '&long_bar=' + BOLL_LONG_BAR;
                }
                // 趋势策略（single/dual）附带信号算法与开/平仓价格取值参数
                if (CURRENT_STRATEGY !== 'boll') {
                    priceParam = '&entry_price=' + ENTRY_PRICE_TYPE + '&exit_price=' + EXIT_PRICE_TYPE +
                        '&signal_algo=' + SIGNAL_ALGO;
                }
                var url = '/api/strategy/detail/' + encodeURIComponent(SYMBOL) +
                    '?bar=' + barParam +
                    '&strategy=' + CURRENT_STRATEGY +
                    longBarParam + priceParam;
                var response = await fetch(url);
                var result = await response.json();

                if (result.code === 200 && result.data) {
                    var data = result.data;
                    loadingEl.style.display = 'none';
                    contentEl.style.display = 'block';

                    var name = data.strategy_name || CURRENT_STRATEGY;
                    document.getElementById('detail-subtitle').textContent =
                        name + ' · ' + data.total_days + '天回测 · ' + data.stats.total_trades + '笔交易';

                    renderMarketSummary(data);
                    renderProfitChart(data);
                    renderTradeRecords(data.trade_records);
                    renderStats(data);
                } else {
                    showError(result.message || '数据加载失败');
                }
            } catch (e) {
                showError('网络请求失败: ' + e.message);
            }
        }

        function showError(msg) {
            loadingEl.style.display = 'none';
            errorEl.style.display = 'block';
            errorEl.textContent = '❌ ' + msg;
        }

        // 启动
        setupSymbolSelector();
        setupStrategySelector();
        setupBarSelector();
        setupDualSelectors();
        setupPriceSelectors();
        togglePeriodSelectors();
        loadDetail();
    })();
    </script>
</body>
</html>
